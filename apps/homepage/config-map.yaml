apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true

  settings.yaml: |
    title: Homelab
    theme: dark
    color: zinc
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      hideVisitURL: false
    layout:
      Apps:
        tab: Overview
        icon: mdi-view-grid
        style: row
        columns: 3
      Network:
        tab: Overview
        icon: mdi-web
        style: row
        columns: 3
      Docs:
        tab: Overview
        icon: mdi-book-open-variant
      Platform:
        tab: Cluster
        icon: mdi-server
        style: row
        columns: 3
      Kubernetes:
        tab: Cluster
        icon: kubernetes.png
        style: row
        columns: 2

  custom.css: |
    :root {
      --hp-accent: #fbbf24;
    }

    html {
      --bg-color: 12 13 16 !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .services-group > button {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .service-group-name {
      text-transform: uppercase !important;
      letter-spacing: 0.14em !important;
      font-size: 0.8rem !important;
      font-weight: 600 !important;
      color: var(--hp-accent) !important;
    }

    .service-card {
      background: #14161b !important;
      border: 1px solid #23262d !important;
      border-radius: 10px !important;
      box-shadow: none !important;
      transition: border-color 150ms ease, background-color 150ms ease !important;
    }

    .service-card:hover {
      background: #181b21 !important;
      border-color: rgba(251, 191, 36, 0.5) !important;
    }

    #tabs > div {
      background: #14161b !important;
      border: 1px solid #23262d !important;
      border-radius: 10px !important;
    }

    button[id$="-tab"] {
      border-radius: 8px !important;
    }

    ::selection {
      background: rgba(251, 191, 36, 0.3);
      color: #fafaf9;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #3f4249 transparent;
    }

    a:focus-visible,
    button:focus-visible,
    .service-card:focus-visible {
      outline: 2px solid var(--hp-accent);
      outline-offset: 2px;
    }
  custom.js: ""
  docker.yaml: ""

  bookmarks.yaml: |
    - Docs:
        - Flux:
            - abbr: FX
              href: https://fluxcd.io/flux/
        - Homepage:
            - abbr: HP
              href: https://gethomepage.dev/latest/
        - Traefik:
            - abbr: TR
              href: https://doc.traefik.io/traefik/
        - cert-manager:
            - abbr: CM
              href: https://cert-manager.io/docs/

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: true
          cpu: true
          memory: true
    - datetime:
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
    - search:
        provider: duckduckgo
        target: _blank

  services.yaml: |
    - Platform:
        - Flux:
            icon: flux.png
            description: GitOps reconciliation
            namespace: flux-system
            podSelector: app.kubernetes.io/part-of=flux
            showStats: true
        - cert-manager:
            icon: cert-manager.png
            description: TLS certificates (homelab-ca)
            namespace: cert-manager
            podSelector: app.kubernetes.io/instance=cert-manager
            showStats: true
        - Traefik:
            icon: traefik.png
            description: Shared tailnet entry point
            namespace: kube-system
            podSelector: app.kubernetes.io/name=traefik
            showStats: true
        - external-dns:
            icon: mdi-dns
            description: home.arpa records via RFC2136
            namespace: external-dns
            podSelector: app.kubernetes.io/name=external-dns
            showStats: true
        - cloudflared:
            icon: cloudflare.png
            description: Cloudflare Tunnel connector
            namespace: cloudflared
            podSelector: app.kubernetes.io/name=cloudflared
            showStats: true
        - Tailscale Operator:
            icon: tailscale.png
            description: Tailnet proxies & services
            namespace: tailscale
            podSelector: app=operator
            showStats: true

    - Network:
        - Tailscale:
            icon: tailscale.png
            href: https://login.tailscale.com/admin/machines
            description: Tailnet admin console & device status
            widget:
              type: tailscale
              deviceid: n3c6UhXsgY11CNTRL
              key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
        - Technitium DNS:
            icon: technitium.png
            href: http://100.90.10.86:5380
            ping: http://100.90.10.86:5380
            description: Authoritative DNS for home.arpa
        - Cloudflare Tunnel:
            icon: cloudflare-zero-trust.png
            href: https://one.dash.cloudflare.com/
            description: cloudflared tunnel status & config
