apiVersion: apps/v1
kind: Deployment
metadata:
  name: ophanim
  namespace: ophanim
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ophanim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ophanim
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ophanim
          image: gitea.home.arpa/nghiant03/ophanim:v2026.10.19
          ports:
            - name: http
              containerPort: 4321
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
