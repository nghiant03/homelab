apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syncthing
  namespace: syncthing
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Syncthing
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: syncthing.png
    gethomepage.dev/href: "https://syncthing.home.arpa/"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=syncthing"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - syncthing.home.arpa
      secretName: syncthing-tls
  rules:
    - host: syncthing.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: syncthing
                port:
                  number: 8384
