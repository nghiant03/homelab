apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 30m
  chart:
    spec:
      chart: renovate
      version: "46.366.1"
      sourceRef:
        kind: HelmRepository
        name: renovate

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    renovate:
      config: |
        {
          "platform": "gitea",
          "endpoint": "https://gitea.home.arpa/api/v1",
          "autodiscover": true,
          "autodiscoverFilter": ["nghiant03/*"],
          "configFileNames": ["workflows/renovate.json"],
          "gitAuthor": "Renovate Bot <renovate@home.arpa>",
          "labels": ["renovate"]
        }

    existingSecret: renovate-token

    cronjob:
      schedule: "*/5 * * * *"

    env:
      LOG_LEVEL: debug
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
