apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 30m
  chart:
    spec:
      chart: renovate
      version: "46.366.1"
      sourceRef:
        kind: HelmRepository
        name: renovate

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    renovate:
      config: |
        {
          "platform": "gitea",
          "endpoint": "https://gitea.home.arpa/api/v1",
          "autodiscover": true,
          "autodiscoverFilter": ["nghiant03/*"],
          "gitAuthor": "Renovate Bot <renovate@home.arpa>",
          "labels": ["renovate"]
        }

    # SOPS-encrypted Secret `renovate-token` in this namespace; its key
    # RENOVATE_TOKEN holds a Gitea personal access token (repo scope) for the
    # nghiant03 account. All keys become env vars on the job pods.
    existingSecret: renovate-token
