apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 30m
  releaseName: gitea
  targetNamespace: gitea

  chart:
    spec:
      chart: gitea
      version: "12.5.3"
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: gitea
      interval: 24h

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: Secret
      name: gitea-values
      valuesKey: values.yaml

  values:
    service:
      ssh:
        type: ClusterIP
        clusterIP: ""
        port: 22

    gitea:
      config:
        server:
          DOMAIN: gitea.homelab.arpa
          ROOT_URL: https://gitea.homelab.arpa/
          SSH_DOMAIN: gitea.homelab.arpa
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222
          START_SSH_SERVER: true

        service:
          DISABLE_REGISTRATION: true

        repository:
          DEFAULT_BRANCH: main

    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path

    valkey-cluster:
      persistence:
        storageClass: local-path

    postgresql-ha:
      enabled: false

    postgresql:
      enabled: true
      primary:
        persistence:
          enabled: true
          size: 10Gi
          storageClass: local-path
          accessModes:
            - ReadWriteOnce

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca
      hosts:
        - host: gitea.homelab.arpa
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - gitea.homelab.arpa
          secretName: gitea-tls
