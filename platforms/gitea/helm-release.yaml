apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 30m
  releaseName: gitea
  targetNamespace: gitea

  chart:
    spec:
      chart: gitea
      version: "12.7.0"
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: gitea
      interval: 24h

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: Secret
      name: gitea-values
      valuesKey: values.yaml

  values:
    service:
      ssh:
        type: ClusterIP
        clusterIP: ""
        port: 22

    gitea:
      config:
        server:
          DOMAIN: gitea.home.arpa
          ROOT_URL: https://gitea.home.arpa/
          PUBLIC_URL_DETECTION: never
          SSH_DOMAIN: gitea.home.arpa
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222
          START_SSH_SERVER: true

        service:
          DISABLE_REGISTRATION: true

        repository:
          DEFAULT_BRANCH: main
          ENABLE_PUSH_CREATE_USER: true

        repository.signing:
          SIGNING_KEY: 33F9026945F7AF1D98C267C19E1E8A17BF8E5DFE
          SIGNING_NAME: Gitea
          SIGNING_EMAIL: gitea@home.arpa

        security:
          ALLOWED_HOST_LIST: "*.home.arpa"

    signing:
      enabled: true
      existingSecret: gitea-gpg-key

    extraVolumes:
      - name: homelab-trust
        configMap:
          name: homelab-trust

    extraContainerVolumeMounts:
      - name: homelab-trust
        mountPath: /etc/ssl/certs/ca-certificates.crt
        subPath: ca-certificates.crt
        readOnly: true

    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path

    valkey-cluster:
      persistence:
        storageClass: local-path

    postgresql-ha:
      enabled: false

    postgresql:
      enabled: true
      primary:
        persistence:
          enabled: true
          size: 10Gi
          storageClass: local-path
          accessModes:
            - ReadWriteOnce

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Gitea
        gethomepage.dev/group: Platform
        gethomepage.dev/icon: gitea.png
        gethomepage.dev/description: Git server & Flux source of truth
        gethomepage.dev/pod-selector: "app.kubernetes.io/name=gitea"
        gethomepage.dev/showStats: "true"
      hosts:
        - host: gitea.home.arpa
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - gitea.home.arpa
          secretName: gitea-tls
