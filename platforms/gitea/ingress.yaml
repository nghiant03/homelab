apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-tailscale
  namespace: gitea
  annotations:
    external-dns.kubernetes.io/hostname: gitea.home.arpa
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gitea-tailscale
      port:
        number: 3000
