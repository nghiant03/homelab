apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns

  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns

    spec:
      serviceAccountName: external-dns

      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.22.0

          args:
            - --provider=rfc2136

            - --source=service
            - --source=ingress

            - --domain-filter=home.arpa

            - --registry=txt
            - --txt-owner-id=homelab
            - --txt-prefix=external-dns-

            - --policy=sync

            - --rfc2136-host=192.168.1.10
            - --rfc2136-port=53
            - --rfc2136-zone=home.arpa
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-axfr
            - --rfc2136-min-ttl=60s

            - --log-level=info

          env:
            - name: EXTERNAL_DNS_RFC2136_TSIG_KEYNAME
              valueFrom:
                secretKeyRef:
                  name: external-dns-secret
                  key: tsig-keyname

            - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: external-dns-secret
                  key: tsig-secret
