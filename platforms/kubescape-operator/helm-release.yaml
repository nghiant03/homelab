apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape-operator
  namespace: kubescape-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kubescape-operator
      version: "1.40.4"
      sourceRef:
        kind: HelmRepository
        name: kubescape
        namespace: kubescape-system
      interval: 24h

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    clusterName: homelab
    ksNamespace: kubescape-system

    alertCRD:
      installDefault: true

    capabilities:
      operator: enable
      configurationScan: enable
      continuousScan: disable
      nodeScan: enable
      runtimeDetection: enable

      vulnerabilityScan: enable
      relevancy: disable

    kubevuln:
      resources:
        limits:
          ephemeral-storage: 30Gi
