apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.9.1"
      sourceRef:
        kind: HelmRepository
        name: kyverno

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    admissionController:
      # Single-node cluster; more replicas would not spread across nodes.
      replicas: 1
