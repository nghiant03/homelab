apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-ca
spec:
  evaluation:
    admission:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: check-runner-namespace
      expression: object.metadata.namespace in ["woodpecker-ci", "renovate"]
  mutations:
    # Apply only the CA entries; copying existing volumes includes atomic
    # projected-volume fields that ApplyConfiguration cannot mutate.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              containers: object.spec.containers.map(container, Object.spec.containers{
                name: container.name,
                volumeMounts: [
                  Object.spec.containers.volumeMounts{
                    name: "homelab-ca-bundle",
                    mountPath: "/etc/ssl/certs/ca-certificates.crt",
                    subPath: "ca-certificates.crt",
                    readOnly: true
                  },
                  Object.spec.containers.volumeMounts{
                    name: "homelab-ca-registry",
                    mountPath: "/etc/docker/certs.d/gitea.home.arpa/ca.crt",
                    subPath: "ca-certificates.crt",
                    readOnly: true
                  }
                ]
              }),
              volumes: [
                Object.spec.volumes{
                  name: "homelab-ca-bundle",
                  configMap: Object.spec.volumes.configMap{
                    name: "homelab-trust"
                  }
                },
                Object.spec.volumes{
                  name: "homelab-ca-registry",
                  configMap: Object.spec.volumes.configMap{
                    name: "homelab-trust"
                  }
                }
              ]
            }
          }
