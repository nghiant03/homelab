apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-ca
spec:
  background: false
  rules:
    - name: mount-homelab-trust
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [woodpecker-ci, renovate]
      mutate:
        patchStrategicMerge:
          spec:
            volumes:
              - name: homelab-ca-bundle
                configMap:
                  name: homelab-trust
              - name: homelab-ca-registry
                configMap:
                  name: homelab-trust
            containers:
              - (name): "*"
                volumeMounts:
                  - name: homelab-ca-bundle
                    mountPath: /etc/ssl/certs/ca-certificates.crt
                    subPath: ca-certificates.crt
                    readOnly: true
                  - name: homelab-ca-registry
                    mountPath: /etc/docker/certs.d/gitea.home.arpa/ca.crt
                    subPath: ca-certificates.crt
                    readOnly: true
