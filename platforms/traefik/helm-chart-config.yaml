apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true
          pathOverride: kube-system/tailnet-traefik

    ports:
      ssh:
        port: 22
        expose: false
