apiVersion: v1
kind: Service
metadata:
  name: tailnet-traefik
  namespace: kube-system
  annotations:
    tailscale.com/hostname: tailnet-traefik
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
