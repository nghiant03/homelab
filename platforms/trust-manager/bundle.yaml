# Syncs the cert-manager root CA into a ca-certificates.crt ConfigMap in every
# namespace, alongside the public roots (useDefaultCAs). Pods that need to
# verify *.home.arpa certs mount it over /etc/ssl/certs/ca-certificates.crt.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: homelab-trust
  namespace: cert-manager
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: homelab-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca-certificates.crt
    namespaceSelector: {}
