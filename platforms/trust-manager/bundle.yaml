apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: homelab-trust
  namespace: cert-manager
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: homelab-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca-certificates.crt
    namespaceSelector: {}
